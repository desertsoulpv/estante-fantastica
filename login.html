<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Estante Fantástica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <header class="py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="nome-site mb-0">Estante Fantástica</h1><a href="index.html"
                class="btn btn-light btn-sm">Voltar</a>
        </div>
    </header>
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="formulario">
                    <h2 class="text-center mb-4">Entrar na conta</h2>
                    <form id="form-login"><label for="email-login" class="form-label">E-mail</label><input type="email"
                            id="email-login" class="form-control mb-3" placeholder="Digite seu e-mail" required>
                        <label for="senha-login" class="form-label">Senha</label><input type="password" id="senha-login"
                            class="form-control mb-3" placeholder="Digite sua senha" required>
                        <button type="submit" class="btn botao w-100">Entrar</button>
                        <p id="mensagem-login" class="mt-3"></p>
                    </form>
                    <hr>
                    <h2 class="text-center mb-3">Criar conta</h2>
                    <form id="form-cadastro"><label for="nome" class="form-label">Nome</label><input type="text"
                            id="nome" class="form-control mb-3" placeholder="Digite seu nome" required>
                        <label for="email-cadastro" class="form-label">E-mail</label><input type="email"
                            id="email-cadastro" class="form-control mb-3" placeholder="Digite seu e-mail" required>
                        <label for="senha-cadastro" class="form-label">Senha</label><input type="password"
                            id="senha-cadastro" class="form-control mb-3" placeholder="Crie uma senha" minlength="6"
                            required>
                        <button type="submit" class="btn botao w-100">Criar conta</button>
                        <p id="mensagem-cadastro" class="mt-3"></p>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
